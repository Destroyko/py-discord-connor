# Конфиг модуля roleGiver (см. py-discord-connor.wiki/components/roleGiver.md).
# Пороги ручной проверки (условия B/C/D, объединяются через OR).

# B: аккаунт Discord младше этого срока (с момента регистрации).
account_min_age_days = 180

# C: пользователь на сервере меньше этого срока (с момента входа).
member_min_tenure_days = 14

# D: между регистрацией аккаунта и входом на сервер прошло меньше этого.
join_after_register_min_minutes = 20
