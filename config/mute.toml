# Конфиг модуля mute (см. py-discord-connor.wiki/components/mute.md).
# Заполняется в P2.D. Здесь — только форма.

# Ссылка «Правила сервера» для DM-шаблонов (не хардкод в тексте).
# Может быть пустой на этапе разработки; заполнить перед проду.
rules_url = "https://discord.com/channels/1545319385244241921/1545319386359922790"

# Окно резервации за автором первого наложения, секунд.
reservation_seconds = 60

# Отложенный мут: если цель вышла с сервера до наложения таймаута, команда
# запоминается и применяется при возвращении. Сколько дней ждать возвращения,
# прежде чем запись удаляется. По умолчанию 30 (нарушения на сервере валидны месяц).
pending_mute_retention_days = 30

# Границы длительности мьюта (60s .. 28d) — жёсткие лимиты Discord timeout,
# заданы константами в коде (connor/core/timefmt.py), в конфиг не выносятся.
