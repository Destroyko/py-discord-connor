# Критерий «медиа»: домены, чьи ссылки в тексте приравниваются к вложению —
# GIF-провайдеры встроенного пикера Discord (Tenor и т.п.), ПЛЮС площадки, чьё
# превью ссылки (Discord unfurl) само по себе может показывать картинку/видео
# с нарушением, даже без файла-вложения. Не хардкод одного домена.
# Матч по хосту: точное совпадение ИЛИ поддомен (host.endswith("." + d)),
# поэтому голого регистрируемого домена достаточно; media-хосты продублированы
# для наглядности. klipy.co — ОТДЕЛЬНЫЙ домен от klipy.com, нужен своей строкой;
# то же для youtube.com/youtu.be и twitter.com/x.com — разные домены, не алиасы.
# discordapp.net/discordapp.com — свой же CDN Discord: ссылка на уже загруженное
# вложение (например, скопированная через "Copy Link"), вставленная как текст,
# а не сам файл-вложение сообщения. Для этих хостов дополнительно требуется путь
# /attachments/ — иначе сюда попадают ссылки на эмодзи/стикеры/аватары (Discord
# подставляет внешний эмодзи в текст как markdown-ссылку на .webp).
gif_domains = [
    "tenor.com",
    "media.tenor.com",
    "klipy.com",
    "static.klipy.com",
    "klipy.co",
    "static.klipy.co",
    "youtube.com",
    "youtu.be",
    "tiktok.com",
    "twitter.com",
    "x.com",
    "discordapp.net",
    "discordapp.com",
]
