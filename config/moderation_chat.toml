# Конфиг модуля moderationChat (см. py-discord-connor.wiki/components/moderationChat.md).
# Оба списка меняются только ручной правкой + рестарт.

# Критерий «обход автомода»: ловить сообщения, проскочившие родной AutoMod Discord
# за счёт подмены букв на похожие из другого алфавита или разделителей между
# буквами. Список банвордов бот читает из правил Discord AutoMod (тип «keyword»,
# только включённые) по API — здесь не дублируется. false → критерий выключен,
# работает только «слова» ниже.
automod_bypass_enabled = true

# Записи из правил Discord AutoMod, которые НЕ проверять на обход: они в автомоде
# нужны, но нарушением не являются (например, эмодзи-флаги некоторых стран).
# Сравнение с ключевым словом правила — по нормализованной форме, целиком.
# Запись из 2 латинских букв понимается ещё и как ISO-код страны: "ru" гасит
# правило с эмодзи-флагом 🇷🇺 (в правилах AutoMod флаг лежит эмодзи, не буквами).
# Сам эмодзи в список тоже можно вставлять.
automod_bypass_ignore = [
    "ru",
    "ua",
]

# Схлопывание повторов буквы при нормализации: серия из N+ одинаковых подряд → одна
# (ааа → а). Меньше 2 не имеет смысла. Трогать редко.
collapse_repeats_min = 3

# Критерий «слова»: plain-список подстрок, сравнение без учёта регистра, без границ слова.
