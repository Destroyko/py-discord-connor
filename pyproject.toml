[project]
name = "connor"
version = "0.1.0"
description = "Connor — Discord moderation bot for a single guild"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.5,<3",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
connor = "connor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["connor*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# Проект русскоязычный: комментарии и docstring на русском. Правила «неоднозначный
# юникод» (кириллица, похожая на латиницу; en-dash) здесь только шумят.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
